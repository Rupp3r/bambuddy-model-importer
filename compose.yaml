services:
  bambuddy-model-importer:
    image: "${IMPORTER_IMAGE:?Set IMPORTER_IMAGE in Portainer}"
    container_name: bambuddy-model-importer
    restart: unless-stopped
    pull_policy: always
    network_mode: gojira_default
    dns:
      - 8.8.8.8
    ports:
      - "8097:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BAMBUDDY_URL: "${BAMBUDDY_URL:-http://host.docker.internal:8756}"
      BAMBUDDY_API_KEY: "${BAMBUDDY_API_KEY:?Set BAMBUDDY_API_KEY in Portainer}"
      IMPORTER_PASSWORD: "${IMPORTER_PASSWORD:?Set IMPORTER_PASSWORD in Portainer}"
      THINGIVERSE_TOKEN: "${THINGIVERSE_TOKEN:-}"
      MAX_DOWNLOAD_MB: "${MAX_DOWNLOAD_MB:-512}"
