services:
  orca-slicer-api:
    image: ghcr.io/maziggy/orca-slicer-api:latest
    container_name: orca-slicer-api
    restart: unless-stopped
    network_mode: gojira_default
    dns:
      - 8.8.8.8
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - /mnt/snailmail/opt/bambuddy/slicer-api/orca:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
